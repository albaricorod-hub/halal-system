<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deploy check — which layer returns 403?</title>
<style>
    :root { --ink:#163b32; --muted:#5c6b65; --line:#dbe6e0; --ok:#0f6b3f; --bad:#a3261c; --warn:#8a6100; }
    * { box-sizing: border-box; }
    body { margin:0; padding:32px 18px; font-family:"Segoe UI",system-ui,-apple-system,sans-serif; color:#1c2b26;
           background:linear-gradient(160deg,#0f2f28 0%,#16463a 42%,#eef5f1 42%,#f8fbf9 100%); }
    main { max-width:760px; margin:0 auto; background:#fff; border-radius:20px; padding:28px 26px;
           box-shadow:0 24px 60px rgba(9,32,26,.22); }
    h1 { margin:0 0 6px; font-size:24px; color:var(--ink); }
    p.lead { margin:0 0 20px; font-size:14px; line-height:1.6; color:var(--muted); }
    table { width:100%; border-collapse:collapse; font-size:13.5px; }
    th, td { text-align:left; padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
    th { font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
    td code { font-size:12.5px; }
    .status { font-weight:800; white-space:nowrap; }
    .s-ok { color:var(--ok); } .s-bad { color:var(--bad); } .s-warn { color:var(--warn); } .s-wait { color:var(--muted); }
    .verdict { margin-top:22px; padding:16px 18px; border-radius:14px; background:#f4f8f5; border:1px solid var(--line);
               font-size:14px; line-height:1.65; }
    .verdict h2 { margin:0 0 8px; font-size:15px; color:var(--ink); }
    ul { margin:8px 0 0 18px; padding:0; } li { margin:4px 0; }
    .meta { margin-top:18px; font-size:11.5px; color:#8a9691; word-break:break-all; }
</style>
</head>
<body>
<main>
    <h1>Deploy check</h1>
    <p class="lead">This page runs in your browser and asks the server for a few known URLs. It never changes anything.
        If this page itself loads, static files are being served from the right folder.</p>

    <table>
        <thead><tr><th>URL</th><th>Status</th><th>What it means</th></tr></thead>
        <tbody id="rows"></tbody>
    </table>

    <div class="verdict" id="verdict">
        <h2>Running checks…</h2>
        <p>Reading status codes from the server.</p>
    </div>

    <p class="meta" id="meta"></p>
</main>

<script>
const checks = [
    { path: 'index.php',    label: 'Home page (PHP)',        expect: 200 },
    { path: 'assets/system-theme.css', label: 'Static CSS',  expect: 200 },
    { path: 'config.php',   label: 'Protected config',       expect: 403 },
    { path: 'db.sql',       label: 'Protected database dump', expect: 403 },
    { path: 'uploads/',     label: 'Folder listing (off)',   expect: 403 }
];

const rows = document.getElementById('rows');
const verdict = document.getElementById('verdict');
const results = {};

function statusText(code) {
    if (code === 0) return { text: 'BLOCKED', cls: 's-bad' };
    if (code >= 200 && code < 300) return { text: code + ' OK', cls: 's-ok' };
    if (code === 403) return { text: '403', cls: 's-bad' };
    if (code === 404) return { text: '404', cls: 's-warn' };
    if (code >= 300 && code < 400) return { text: code + ' redirect', cls: 's-warn' };
    return { text: String(code), cls: 's-warn' };
}

function meaning(path, code) {
    if (path === 'index.php') {
        if (code === 0) return 'The server refused the request before PHP ran (network/challenge block).';
        if (code === 200) return 'PHP runs. The app folder is correct.';
        if (code === 403) return 'PHP file exists but access is denied — hosting/WAF rule, not your app.';
        if (code === 404) return 'No index.php in this folder — files are in the wrong directory.';
        if (code >= 500) return 'PHP ran but the app errored (often the database).';
        return 'Unexpected response.';
    }
    if (path.startsWith('assets/')) {
        if (code === 200) return 'Static files are served.';
        return 'Even static files are blocked — the block is above PHP (folder, WAF, suspension).';
    }
    if (path === 'config.php') {
        if (code === 403) return 'Correct: the .htaccess rule is active.';
        if (code === 200) return 'WARNING: .htaccess is missing or not applied — this file is public.';
        if (code === 404) return 'config.php is not in this folder — wrong directory, or the file was never uploaded.';
        return 'Unexpected response.';
    }
    if (path === 'db.sql') {
        if (code === 403) return 'Correct: the .htaccess rule is active.';
        if (code === 200) return 'WARNING: .htaccess is missing or not applied — this file is public.';
        if (code === 404) return 'Not uploaded (expected — import it through phpMyAdmin instead).';
        return 'Unexpected response.';
    }
    if (path === 'uploads/') {
        if (code === 403) return 'Correct: directory listing is disabled.';
        if (code === 200) return 'Directory listing is enabled — .htaccess not applied.';
        return 'Unexpected response.';
    }
    return '';
}

async function probe(c) {
    const url = new URL(c.path, window.location.href);
    url.searchParams.set('probe', Date.now());
    try {
        const res = await fetch(url, { method: 'GET', cache: 'no-store', credentials: 'include', redirect: 'follow' });
        return res.status;
    } catch (err) {
        return 0;
    }
}

(async () => {
    for (const c of checks) {
        const tr = document.createElement('tr');
        tr.innerHTML = '<td><code>' + c.path + '</code><br><span class="s-wait">' + c.label + '</span></td>' +
                       '<td class="status s-wait">…</td><td class="s-wait">checking</td>';
        rows.appendChild(tr);
        const code = await probe(c);
        results[c.path] = code;
        const st = statusText(code);
        tr.children[1].className = 'status ' + st.cls;
        tr.children[1].textContent = st.text;
        tr.children[2].className = st.cls;
        tr.children[2].textContent = meaning(c.path, code);
    }

    const idx = results['index.php'];
    const css = results['assets/system-theme.css'];
    const cfg = results['config.php'];
    let html = '<h2>Verdict</h2>';

    if (idx === 0 && css === 0) {
        html += '<p><strong>The browser could not reach the server at all.</strong> That is usually the InfinityFree ' +
                'browser-security check or a suspended account, not your code.</p>' +
                '<ul><li>Open the site in a normal window (not a preview/curl tool), allow cookies and JavaScript.</li>' +
                '<li>Try <code>http://</code> instead of <code>https://</code>, then reload.</li>' +
                '<li>Check the client area for a suspension or daily-hit-limit notice.</li></ul>';
    } else if (idx === 404) {
        html += '<p><strong>This folder has no <code>index.php</code>.</strong> The files went to a different directory ' +
                'or into a subfolder created by the zip extractor. Move <code>index.php</code> and the rest so they sit ' +
                '<em>directly</em> in the folder shown under Domains → Manage → Directory Status.</p>';
    } else if (idx === 403 && css === 200) {
        html += '<p><strong>Static files work but <code>index.php</code> is refused.</strong> That is a PHP-level block: ' +
                'either the request is hitting a path rule or the file is not executable where it sits. Rename ' +
                '<code>.htaccess</code> to <code>.htaccess.off</code> and reload to confirm.</p>';
    } else if (idx === 403 && css === 403) {
        html += '<p><strong>Every file is refused, including CSS.</strong> The block is above PHP. Most likely: files are ' +
                'not in the domain\'s document root, the WAF is blocking this URL, or the account is suspended. ' +
                'Check Domains → Manage → Directory Status, then try the same check from a different network.</p>';
    } else if (idx >= 500) {
        html += '<p><strong>PHP runs but the page errors.</strong> The 403 is solved — what remains is the database ' +
                'connection. Check the four values at the top of <code>config.php</code> and that <code>db.sql</code> ' +
                'was imported into the same database.</p>';
    } else if (idx === 200) {
        html += '<p><strong>The application is being served correctly.</strong> If a browser tab still shows 403, it is ' +
                'stale cache or the challenge cookie — hard-reload, or open the same URL in a private window.</p>';
    } else {
        html += '<p>Mixed results — see the table above.</p>';
    }

    if (cfg === 200) {
        html += '<p style="color:#a3261c"><strong>Security warning:</strong> <code>config.php</code> is readable over HTTP. ' +
                'The <code>.htaccess</code> file is missing from this folder or was not uploaded (it is a dotfile and is ' +
                'often hidden in file managers).</p>';
    }

    html += '<p style="margin-top:14px">Delete <code>_check.html</code> once you are done.</p>';
    verdict.innerHTML = html;
    document.getElementById('meta').textContent = 'Page: ' + window.location.href + ' · Browser time: ' + new Date().toLocaleString();
})();
</script>
</body>
</html>
